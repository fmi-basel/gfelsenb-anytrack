[project]
name = "anytrack"
version = "0.1.0"
description = "Modular ROI-based centroid tracking for AVI videos + per-frame timing CSV, with a ttkbootstrap GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "ttkbootstrap>=1.10",
  "tksheet>=7.0",
  "platformdirs>=4.0",
  "tqdm>=4.67.1",
  "matplotlib>=3.10.8",
  "pyarrow>=22.0.0",
  "scikit-learn>=1.7.2",
]

[project.scripts]
anytrack = "anytrack.cli:main"
anytrack-bg = "anytrack.cli:bg_main"
anytrack-roi = "anytrack.cli:roi_main"
anytrack-bench = "anytrack.benchmark:main"
anytrack-crop-export = "anytrack.cropper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anytrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Install this project (editable) so its console scripts land in the venv.
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
