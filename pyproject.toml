[project]
name = "anytrack"
version = "0.1.0"
description = "Modular ROI-based centroid tracking for AVI videos + per-frame timing CSV, with a ttkbootstrap GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "ttkbootstrap>=1.10",
  "tksheet>=7.0",
  "platformdirs>=4.0",
  "tqdm>=4.67.1",
]

[project.scripts]
anytrack = "anytrack.cli:main"
anytrack-bg = "anytrack.cli:bg_main"
anytrack-roi = "anytrack.cli:roi_main"

[tool.uv]
# uv will generate uv.lock when you run `uv lock`.
# Pin/override versions here if needed.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
typeCheckingMode = "basic"
