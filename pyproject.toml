[project]
name = "anytrack"
version = "0.1.0"
description = "Modular ROI-based centroid tracking for AVI videos + per-frame timing CSV, with a ttkbootstrap GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "ttkbootstrap>=1.10",
  "tksheet>=7.0",
  "platformdirs>=4.0",
  "tqdm>=4.67.1",
  "matplotlib>=3.10.8",
  "pyarrow>=22.0.0",
  "scikit-learn>=1.7.2",
]

[project.scripts]
anytrack = "anytrack.cli:main"
anytrack-run = "anytrack.run:main"
anytrack-bg = "anytrack.cli:bg_main"
anytrack-roi = "anytrack.cli:roi_main"
anytrack-bench = "anytrack.benchmark:main"
anytrack-crop-export = "anytrack.cropper:main"
anytrack-qc = "anytrack.qc:main"
anytrack-label = "anytrack.pose.label_gui:main"
anytrack-train = "anytrack.pose.train:main"
anytrack-debug = "anytrack.gui.debug_app:main"
anytrack-arena-debug = "anytrack.gui.arena_debug:main"

[project.optional-dependencies]
# Pose labeling/export bridge (Milestone B). Optional: the classical tracker and
# the label GUI work without it. sleap-io reads/writes .slp for the SLEAP
# training handoff and has broad Python support.
#   uv pip install 'anytrack[pose]'
pose = [
  "sleap-io>=0.1",
]
# The training/inference backend (sleap-nn + torch) is NOT declared here: it is
# prerelease (v0.x), requires Python >=3.11, and pinning it breaks uv's universal
# resolver for the base project. Install it directly into the pose environment:
#   uv pip install --prerelease=allow 'sleap-nn[torch]'

# Optional Segment-Anything backend for odor-port detection (port_backend='sam').
# The default classical detector needs nothing; this is only for extra robustness.
#   uv pip install 'anytrack[sam]'  (plus a SAM checkpoint via cfg.sam_model_path)
sam = [
  "segment-anything>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anytrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Install this project (editable) so its console scripts land in the venv.
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
